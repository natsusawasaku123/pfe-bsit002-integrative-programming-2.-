openapi: 3.0.3
info:
  title: Employee Management API
  version: 1.0.0
  description: Week 3 API design for viewing, creating, updating, deleting, searching,
    and filtering employee records. The endpoints are planned for Laravel implementation.
servers:
- url: http://127.0.0.1:8000/api/v1
  description: Planned local Laravel API, version 1
tags:
- name: Employees
  description: Employee records and their assigned department names.
paths:
  /employees:
    get:
      tags:
      - Employees
      summary: List, search, or filter employees
      operationId: listEmployees
      description: Returns all employees when no query parameter is supplied. search
        matches employee names; department filters by department name. Both filters
        may be combined.
      parameters:
      - name: search
        in: query
        required: false
        description: Search by first or last name.
        schema:
          type: string
        example: juan
      - name: department
        in: query
        required: false
        description: Filter by department name.
        schema:
          type: string
        example: IT
      responses:
        '200':
          description: Employee list returned. An empty list is returned when no employee
            matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
              example:
              - id: 1
                first_name: Juan
                last_name: Dela Cruz
                email: juan@example.com
                department: IT
                position: Programmer
                created_at: '2026-08-04T10:00:00Z'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Employees
      summary: Create an employee
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
            example:
              first_name: Juan
              last_name: Dela Cruz
              email: juan@example.com
              department: IT
              position: Programmer
      responses:
        '201':
          description: Employee created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
              example:
                id: 1
                first_name: Juan
                last_name: Dela Cruz
                email: juan@example.com
                department: IT
                position: Programmer
                created_at: '2026-08-04T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /employees/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: The employee ID.
      schema:
        type: integer
        minimum: 1
      example: 1
    get:
      tags:
      - Employees
      summary: View one employee
      operationId: getEmployee
      responses:
        '200':
          description: Employee returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
              example:
                id: 1
                first_name: Juan
                last_name: Dela Cruz
                email: juan@example.com
                department: IT
                position: Programmer
                created_at: '2026-08-04T10:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
      - Employees
      summary: Update an employee
      operationId: updateEmployee
      description: Replaces the editable employee fields. Submit all five fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
            example:
              first_name: Juan
              last_name: Dela Cruz
              email: juan@example.com
              department: IT
              position: Programmer
      responses:
        '200':
          description: Employee updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
              example:
                id: 1
                first_name: Juan
                last_name: Dela Cruz
                email: juan@example.com
                department: IT
                position: Programmer
                created_at: '2026-08-04T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Employees
      summary: Delete an employee
      operationId: deleteEmployee
      responses:
        '200':
          description: Employee deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Employee deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    EmployeeInput:
      type: object
      required:
      - first_name
      - last_name
      - email
      - department
      - position
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Juan
        last_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Dela Cruz
        email:
          type: string
          format: email
          description: Must be unique across employee records.
          example: juan@example.com
        department:
          type: string
          minLength: 1
          maxLength: 100
          example: IT
        position:
          type: string
          minLength: 1
          maxLength: 100
          example: Programmer
      example:
        first_name: Juan
        last_name: Dela Cruz
        email: juan@example.com
        department: IT
        position: Programmer
    Employee:
      type: object
      required:
      - id
      - first_name
      - last_name
      - email
      - department
      - position
      - created_at
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
          example: 1
        first_name:
          type: string
          example: Juan
        last_name:
          type: string
          example: Dela Cruz
        email:
          type: string
          format: email
          example: juan@example.com
        department:
          type: string
          example: IT
        position:
          type: string
          example: Programmer
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-08-04T10:00:00Z'
      example:
        id: 1
        first_name: Juan
        last_name: Dela Cruz
        email: juan@example.com
        department: IT
        position: Programmer
        created_at: '2026-08-04T10:00:00Z'
    Message:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ValidationError:
      type: object
      required:
      - message
      - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    BadRequest:
      description: The JSON request body is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Invalid JSON request body
    NotFound:
      description: No employee exists with the supplied ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Employee not found
    ValidationError:
      description: A required field is missing, a value is invalid, or the employee
        email is already used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The given data was invalid.
            errors:
              email:
              - The email field must be a valid email address.
    ServerError:
      description: An unexpected server error prevented completion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Server error
